<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Тонкие линейные иконки, viewBox 24x24, stroke="currentColor", без заливки.
       Стиль вдохновлён Phosphor / Lucide, адаптирован под VHS-эстетику. -->

  <!-- Ум: голова в профиль с мозговой завитушкой внутри -->
  <symbol id="stat-mind" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15.5 3.5c-3 0-5 1.5-6 3.5-1 .5-2 1.5-2 3 0 .8.3 1.5.8 2-.5.5-.8 1.2-.8 2 0 1.5 1 2.5 2 3v3l2 1c.5.5 1.5 1 2.5 1 2 0 3.5-1.5 3.5-3.5V18"/>
    <path d="M13 9c.5-.5 1.2-.5 1.7 0M11.5 12.5c.4.4 1 .4 1.4 0M10.5 16c.3.3.8.3 1.1 0"/>
    <path d="M15.5 3.5c2.5 0 4 2 4 4 0 1-.3 1.8-.8 2.5.5.7.8 1.5.8 2.3 0 2-1.5 3.2-3.5 3.2"/>
  </symbol>

  <!-- Тело: фигура человека в движении -->
  <symbol id="stat-body" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="4.5" r="2"/>
    <path d="M12 7v5"/>
    <path d="M8 9l4 1.5L16 9"/>
    <path d="M12 12l-3 5M12 12l3 5"/>
    <path d="M9 17l-1 4M15 17l1 4"/>
  </symbol>

  <!-- Семья: домик с окном-сердцем -->
  <symbol id="stat-family" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11l9-7 9 7"/>
    <path d="M5 10v9h14v-9"/>
    <path d="M12 19v-5"/>
    <path d="M10 14c0-1 .8-1.8 2-1.8s2 .8 2 1.8c0 1.4-2 2.7-2 2.7s-2-1.3-2-2.7z"/>
  </symbol>

  <!-- Друзья: две головы рядом -->
  <symbol id="stat-friends" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8.5" cy="8" r="3"/>
    <circle cx="16" cy="9" r="2.5"/>
    <path d="M3 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/>
    <path d="M14 19c0-2 1-3.5 3-3.5s3 1.5 3 3.5"/>
  </symbol>

  <!-- Здоровье: пульс/кардиограмма в круге -->
  <symbol id="stat-health" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M4 12h3l2-4 3 8 2-5 2 1h4"/>
  </symbol>

  <!-- Внешность: зеркало с отражением света -->
  <symbol id="stat-looks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="10" rx="6" ry="7"/>
    <path d="M12 17v4M9 21h6"/>
    <path d="M9 7c.5-1 1.5-2 3-2"/>
    <circle cx="15" cy="7.5" r=".7" fill="currentColor"/>
  </symbol>

  <!-- Достаток: пачка купюр с верхней «банкнотой» -->
  <symbol id="stat-wealth" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="8" width="18" height="10" rx="1.5"/>
    <circle cx="12" cy="13" r="2.2"/>
    <path d="M5 11h.01M19 11h.01M5 15h.01M19 15h.01"/>
    <path d="M5 6h14M6 4h12"/>
  </symbol>

  <!-- Авторитет: корона из трёх зубцов -->
  <symbol id="stat-authority" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 17l1.5-9 4 5L12 6l3.5 7 4-5L21 17z"/>
    <path d="M3 17v2c0 .6.4 1 1 1h16c.6 0 1-.4 1-1v-2"/>
    <path d="M3 17h18"/>
    <circle cx="4.5" cy="8" r=".8" fill="currentColor"/>
    <circle cx="12" cy="6" r=".8" fill="currentColor"/>
    <circle cx="19.5" cy="8" r=".8" fill="currentColor"/>
  </symbol>
</svg>
